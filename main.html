
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cat Evolution 2048</title>
    
    <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

    <header>
        <h1>Cat Evolutions</h1>
        <p>Merge cats and discover new species!</p>
    </header>

    <main class="game-container">

        <section class="game-info">

            <div class="score-box">
                <span>Score</span>
                <h2 id="score">0</h2>
            </div>

            <div class="score-box">
                <span>Best</span>
                <h2 id="best">0</h2>
            </div>

        </section>

        <button id="new-game" type="button">New Game</button>

        <section class="animation-controls" aria-label="Merge animation settings">
            <div class="animation-control">
                <label for="merge-speed">
                    Merge animation speed
                    <output id="merge-speed-value" for="merge-speed">350 ms</output>
                </label>
                <input id="merge-speed" type="range" min="100" max="1000" step="50" value="350">
            </div>
            <div class="animation-control">
                <label for="merge-alpha">
                    Merge animation alpha
                    <output id="merge-alpha-value" for="merge-alpha">75%</output>
                </label>
                <input id="merge-alpha" type="range" min="20" max="100" step="5" value="75">
            </div>
        </section>

        <p id="message">Combine matching cats to evolve!</p>

        <section id="board" class="game-board">
            <!-- Game tiles will appear here -->
        </section>

        <section class="instructions">
            <h3>How to Play</h3>
            <p>Use your arrow keys to move the cats.</p>
            <p>Merge two identical cats to evolve!</p>
            <p>Reach 8192 to discover the ultimate feline.</p>
        </section>

    </main>

    <!-- NEW CAT COLLECTION TAB -->

<div class="new-cat-collection">

    <details>
        <summary>
            My Cat Collection
            <span>▼</span>
        </summary>

        <div id="new-cat-list"></div>

    </details>

</div>

    <footer>
        <p>Cat Evolution 2048 ©2026</p>
    </footer>

    <script src="script.js?v=3"></script>

</body>
</html>
